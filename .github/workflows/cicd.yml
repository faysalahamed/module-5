name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests & Capture Results
        # Redirecting test output to a text file for artifact management
        run: npm test > test-results.txt || echo "Tests Failed" > test-results.txt

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results.txt

  deploy:
    needs: test 
    runs-on: self-hosted 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install --production

      - name: Deploy Application
        run: |
          # Use PM2 to keep the app running in the background
          # If PM2 isn't installed, 'node index.js' works but won't persist
          pm2 restart node-app || pm2 start index.js --name node-app
